appId: com.stephenw310.attn
productName: Attn

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/tray.png
  - '!node_modules/better-sqlite3/{build,deps,src}/**/*'

asar: true

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  identity: '-'
  hardenedRuntime: false
  icon: icon.icns
  target:
    - dmg
    - zip
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}.node)'
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/darwin-${arch}.node

win:
  icon: icon.ico
  target:
    - nsis
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(win32-${arch}.node)'
  asarUnpack:
    - node_modules/better-sqlite3/prebuilds/win32-${arch}.node

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
