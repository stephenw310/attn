name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve Electron version
        id: electron
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # setup-node's npm cache covers registry tarballs only. The Electron
      # binary is fetched separately by the postinstall toolchain script into
      # ~/.cache/electron, and without this every job downloads it again.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Check lint and formatting
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  electron-smoke-shard:
    name: Electron smoke shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve Electron version
        id: electron
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # Each runner keeps one Electron worker (see playwright.config.ts), while
      # Playwright distributes the complete functional suite across four jobs.
      - name: Run Electron smoke tests
        # Visible windows inside Xvfb keep animation frames and editor selection events active.
        run: npm run e2e -- --visible --shard=${{ matrix.shard }}/4

      # `retries: 1` in CI turns a flake into a green run. The JSON reporter
      # records it; this prints it so the job log says so out loud.
      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.mjs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-artifacts-${{ matrix.shard }}
          path: e2e/.artifacts/
          if-no-files-found: ignore
          # The e2e output directories are dot-directories, which v4 skips by default.
          include-hidden-files: true

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-traces-${{ matrix.shard }}
          path: e2e/.results/
          if-no-files-found: ignore
          # The e2e output directories are dot-directories, which v4 skips by default.
          include-hidden-files: true

  electron-smoke:
    name: Electron smoke
    if: always()
    needs: [verify, electron-smoke-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E shard to pass
        if: needs.verify.result != 'success' || needs.electron-smoke-shard.result != 'success'
        run: exit 1

  electron-perf:
    name: Electron performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve Electron version
        id: electron
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Run Electron performance smoke
        # This job measures requestAnimationFrame paint latency. Keep the app
        # visible inside xvfb so Chromium does not apply its hidden-window cadence.
        run: npm run e2e:perf -- --visible

      # `retries: 1` in CI turns a flake into a green run. The JSON reporter
      # records it; this prints it so the job log says so out loud.
      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.mjs

      - name: Upload performance traces and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-perf-artifacts
          path: |
            e2e/.artifacts/
            e2e/.results/
          if-no-files-found: ignore
          # The e2e output directories are dot-directories, which v4 skips by default.
          include-hidden-files: true
