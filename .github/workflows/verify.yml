name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint and formatting
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  electron-smoke:
    name: Electron smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron smoke tests
        run: npm run e2e

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-artifacts
          path: e2e/.artifacts/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-traces
          path: e2e/.results/
          if-no-files-found: ignore

  electron-perf:
    name: Electron performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron performance smoke
        # This job measures requestAnimationFrame paint latency. Keep the app
        # visible inside xvfb so Chromium does not apply its hidden-window cadence.
        run: npm run e2e:perf -- --visible

      - name: Upload performance traces and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-perf-artifacts
          path: |
            e2e/.artifacts/
            e2e/.results/
          if-no-files-found: ignore
