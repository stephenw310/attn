name: Release

# Publishes a signed, notarized release to the GitHub Releases feed the
# installed apps update from (T39, SPEC §6 Packaging). Runs when a `v*` tag is
# pushed, or by hand from any ref; either way the version is package.json's,
# the tag must match it, and the commit must already be on `main`.
#
# What it needs (Settings → Environments → `release`; the feed check, build,
# and publish jobs run in that environment, so its deployment-branch rule — `main` plus
# tags `v*` — and any required reviewers are what stand between a branch and
# the signing credentials):
#   secrets  CSC_LINK, CSC_KEY_PASSWORD          Developer ID Application .p12 (base64) + password
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarytool login
#            WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD  Windows code-signing .pfx (base64) + password
#            ATTN_RELEASE_TOKEN                  only when the feed is another repository:
#                                                a token with contents:write there
#   variables ATTN_RELEASE_FEED                  owner/repo of the update feed; defaults to
#                                                this repository
#             ATTN_ALLOW_PRIVATE_FEED            'true' to publish into a private feed anyway
#                                                (installed apps cannot read one anonymously)
#
# The whole verification contract (`npm run verify`) runs first, each build
# verifies itself with `package:verify --release` before uploading, and the
# publish job stamps the target and minimum migratable schemas into
# latest.yml / latest-mac.yml and places them in the rolling `update-feed`
# release. An installed app accepts a newer schema only when that release can
# migrate its open database.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version and feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      feed: ${{ steps.meta.outputs.feed }}
      schema: ${{ steps.meta.outputs.schema }}
      minimum_schema: ${{ steps.meta.outputs.minimum_schema }}
      feed_tag: ${{ steps.meta.outputs.feed_tag }}
      same_repo: ${{ steps.meta.outputs.same_repo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Read version, schema, and feed
        id: meta
        env:
          FEED: ${{ vars.ATTN_RELEASE_FEED || github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          schema="$(node --input-type=module -e "import('./scripts/write-distribution-metadata.mjs').then(m => console.log(m.packagedSchemaVersion()))")"
          minimum_schema="$(node --input-type=module -e "import('./scripts/write-distribution-metadata.mjs').then(m => console.log(m.packagedSchemaVersions().minimumSchemaVersion))")"
          tag="v$version"
          # Plain major.minor.patch only: the updater compares numerically and
          # the feed has no prerelease channel.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version $version is not a release version (major.minor.patch, no prerelease suffix)"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $version (expected $tag)"
            exit 1
          fi
          case "$FEED" in
            */*) ;;
            *) echo "::error::ATTN_RELEASE_FEED must be owner/repo, got '$FEED'"; exit 1 ;;
          esac
          same_repo=false
          [ "$FEED" = "${{ github.repository }}" ] && same_repo=true
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "feed=$FEED"
            echo "schema=$schema"
            echo "minimum_schema=$minimum_schema"
            echo "feed_tag=update-feed"
            echo "same_repo=$same_repo"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Attn $version (migrates schema v$minimum_schema..v$schema) to $FEED as $tag" >> "$GITHUB_STEP_SUMMARY"

      # Only commits already on main are released, whatever ref the run was
      # started from, and an existing tag must name this exact commit — a
      # manual re-run after a deleted release must not attach fresh binaries
      # to a tag that points at other source.
      - name: Check the commit is on main and the tag, if present, names it
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.sha }} is not on main; merge first, then release"
            exit 1
          fi
          if git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            tagged="$(git rev-parse "$TAG^{commit}")"
            if [ "$tagged" != "${{ github.sha }}" ]; then
              echo "::error::tag $TAG already exists and points at $tagged, not ${{ github.sha }}"
              exit 1
            fi
          fi

  verify:
    name: Verify (typecheck, lint, unit, build, e2e)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve Electron version
        id: electron
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # The definition of done from AGENTS.md, on the exact commit being
      # released. A tag push never runs verify.yml, and a manual dispatch may
      # name a commit no pull request gated, so nothing is signed before this
      # passes.
      - name: Run the verification contract
        run: npm run verify

      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.mjs

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-traces
          path: e2e/.results/
          if-no-files-found: ignore
          include-hidden-files: true

  feed:
    name: Check release feed
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.ATTN_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      FEED: ${{ needs.prepare.outputs.feed }}
      TAG: ${{ needs.prepare.outputs.tag }}
      ALLOW_PRIVATE: ${{ vars.ATTN_ALLOW_PRIVATE_FEED }}
    steps:
      # electron-updater reads a GitHub Releases feed anonymously, so a private
      # feed repository is one the installed apps cannot see. This job runs
      # after source validation and verification because a cross-repository
      # token stored in the release environment is unavailable to prepare.
      - name: Check the feed is readable and the release is new
        run: |
          private="$(gh api "repos/$FEED" --jq .private)"
          if [ "$private" = "true" ] && [ "$ALLOW_PRIVATE" != "true" ]; then
            echo "::error::$FEED is private: installed apps cannot read its releases. Publish to a public feed repository (set ATTN_RELEASE_FEED), make it public, or set ATTN_ALLOW_PRIVATE_FEED=true."
            exit 1
          fi
          if gh release view "$TAG" --repo "$FEED" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists in $FEED; bump package.json instead of republishing"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            artifact: release-macos
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - platform: Windows
            runner: windows-latest
            artifact: release-windows
            paths: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # `release:*` packages in release mode and then runs the release
      # verifier: signature, notarization ticket, and feed metadata. A missing
      # credential fails here, inside electron-builder, rather than producing
      # a personal artifact that the verifier would then reject. Each OS step
      # receives only its own credentials.
      - name: Package, sign, notarize, and verify (macOS)
        if: runner.os == 'macOS'
        run: npm run release:mac
        env:
          ATTN_DISTRIBUTION_MODE: release
          ATTN_RELEASE_FEED: ${{ needs.prepare.outputs.feed }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package, sign, and verify (Windows)
        if: runner.os == 'Windows'
        run: npm run release:win
        env:
          ATTN_DISTRIBUTION_MODE: release
          ATTN_RELEASE_FEED: ${{ needs.prepare.outputs.feed }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ needs.prepare.outputs.feed }}
    needs: [prepare, build, feed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    # All tags compare and replace one rolling feed. Keep the monotonic check
    # inside this lock.
    concurrency:
      group: release-feed-${{ needs.prepare.outputs.feed }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ATTN_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      FEED: ${{ needs.prepare.outputs.feed }}
      TAG: ${{ needs.prepare.outputs.tag }}
      FEED_TAG: ${{ needs.prepare.outputs.feed_tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SCHEMA: ${{ needs.prepare.outputs.schema }}
      MINIMUM_SCHEMA: ${{ needs.prepare.outputs.minimum_schema }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # The feed files point at the versioned release's assets by absolute
      # URL and carry the migration range. The step fails when a feed file
      # names another version, names an asset that was not built, or is not
      # newer than the rolling feed.
      - name: Stamp the feed files
        run: |
          mkdir -p current
          current_args=()
          if gh release view "$FEED_TAG" --repo "$FEED" >/dev/null 2>&1; then
            gh release download "$FEED_TAG" --repo "$FEED" --dir current --pattern 'latest*.yml'
            current_args=(--current current)
          fi
          node scripts/stamp-update-feed.mjs release \
            --assets-base "https://github.com/$FEED/releases/download/$TAG" \
            "${current_args[@]}"
          ls -l release
          {
            echo '```'
            cat release/latest-mac.yml release/latest.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Create as a draft, upload every asset, then publish in one step:
      # no client ever sees a release whose assets are still arriving.
      - name: Create the versioned release and upload assets
        env:
          SAME_REPO: ${{ needs.prepare.outputs.same_repo }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          notes="Attn $VERSION. Opens schema v$SCHEMA and migrates profiles from v$MINIMUM_SCHEMA or newer. Installed release builds update automatically from update-feed. Built from $SOURCE."
          if [ "$SAME_REPO" = "true" ]; then
            gh release create "$TAG" --repo "$FEED" --draft --title "Attn $VERSION" \
              --target "${{ github.sha }}" --generate-notes --notes "$notes"
          else
            gh release create "$TAG" --repo "$FEED" --draft --title "Attn $VERSION" --notes "$notes"
          fi
          gh release upload "$TAG" --repo "$FEED" release/*
          gh release edit "$TAG" --repo "$FEED" --draft=false --latest
          echo "Published https://github.com/$FEED/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # update-feed is a rolling prerelease whose only assets are feed files.
      - name: Point the update feed at the new release
        run: |
          if ! gh release view "$FEED_TAG" --repo "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --repo "$FEED" --prerelease --title "Attn update feed" \
              --notes "Rolling update feed for Attn. Not an installer; download a versioned release instead."
          fi
          gh release upload "$FEED_TAG" --repo "$FEED" --clobber release/latest*.yml
          echo "Feed $FEED_TAG now offers $VERSION" >> "$GITHUB_STEP_SUMMARY"
