# Git hooks. Installed automatically via `npm install` (prepare script);
# run `npx lefthook install` manually after cloning if hooks aren't firing.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{ts,tsx,js,jsx,json,css,html}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: biome-full
      run: npx biome check .
